name: Check admin/config.yml sync

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "admin/config.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.html"
      - "admin/config.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-admin-sync.js
