name: Update sitemap lastmod

on:
  push:
    branches: [main]
    paths:
      - "*.html"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: node scripts/update-sitemap-lastmod.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "No sitemap changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: aggiorna lastmod sitemap.xml [skip ci]"
          git push
